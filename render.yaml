services:
  - type: web
    name: clinic-booking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: API_KEY
        sync: false   # paste the key you generated
